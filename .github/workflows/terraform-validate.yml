name: Terraform Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Configure access to private child modules
        env:
          PORT_SKILLS_REGISTRY_TOKEN: ${{ secrets.PORT_SKILLS_REGISTRY_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${PORT_SKILLS_REGISTRY_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Terraform Init (no backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify README exists
        run: |
          if [ ! -f README.md ]; then
            echo "❌ README.md is required"
            exit 1
          fi
          echo "✅ README.md found"

      - name: Verify .gitignore exists
        run: |
          if [ ! -f .gitignore ]; then
            echo "❌ .gitignore is required"
            exit 1
          fi
          echo "✅ .gitignore found"

      - name: Verify no secrets in code
        run: |
          if grep -r "ghp_\|AKIA\|password\|secret" --include="*.tf" --include="*.tfvars"; then
            echo "❌ Potential secrets found in code"
            exit 1
          fi
          echo "✅ No obvious secrets detected"
