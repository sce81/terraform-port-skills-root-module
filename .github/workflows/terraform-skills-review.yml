name: Terraform Port Skills Review

on:
  workflow_dispatch:
    inputs:
      skill_identifier:
        description: Skill identifier to review
        required: true
        type: string
      review_type:
        description: Type of review to perform
        required: true
        type: choice
        options: [validate, audit, compliance, documentation]
      depth:
        description: Review depth
        required: true
        type: choice
        options: [quick, standard, comprehensive]
      port_workflow_node_run_id:
        description: Port workflow node run identifier
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: skills-review-${{ inputs.skill_identifier }}
  cancel-in-progress: false

jobs:
  skills_review:
    runs-on: ubuntu-latest
    env:
      SKILL_IDENTIFIER: ${{ inputs.skill_identifier }}
      REVIEW_TYPE: ${{ inputs.review_type }}
      REVIEW_DEPTH: ${{ inputs.depth }}
      PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
      PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
      PORT_WORKFLOW_NODE_RUN_ID: ${{ inputs.port_workflow_node_run_id }}
      GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Report review started to Port
        env:
          PORT_NODE_RUN_STATUS: IN_PROGRESS
          PORT_NODE_RUN_STAGE: Skills review started
        run: |
          curl -X PATCH https://api.getport.io/v1/blueprints/skill/runs/${{ env.PORT_WORKFLOW_NODE_RUN_ID }} \
            -H "Authorization: Bearer $(echo -n "${{ env.PORT_CLIENT_ID }}:${{ env.PORT_CLIENT_SECRET }}" | base64)" \
            -H "Content-Type: application/json" \
            -d '{
              "status": "IN_PROGRESS",
              "logMessage": "Starting review of skill: ${{ env.SKILL_IDENTIFIER }}"
            }' || true

      - name: Terraform Init
        run: |
          terraform init -backend=false

      - name: Validate Terraform Configuration
        if: inputs.review_type == 'validate' || inputs.review_type == 'compliance'
        run: |
          echo "=== Terraform Validation ==="
          terraform validate
          terraform fmt -check -recursive || echo "Format issues detected"

      - name: Security Audit
        if: inputs.review_type == 'audit' || inputs.review_type == 'compliance'
        run: |
          echo "=== Security Audit ==="

          # Check for hardcoded secrets
          if grep -r "secret\|password\|token\|key" --include="*.tf" --include="*.tfvars" | grep -v "TF_VAR\|variable\|description\|sensitive"; then
            echo "❌ Potential secrets found"
          else
            echo "✅ No obvious hardcoded secrets"
          fi

          # Check for public access patterns
          if grep -r "public_access\|public\s*=\s*true" --include="*.tf"; then
            echo "⚠️  Public access configurations found"
          fi

      - name: Skills Documentation Review
        if: inputs.review_type == 'documentation' || inputs.review_type == 'comprehensive'
        run: |
          echo "=== Skills Documentation Review ==="

          SKILL_DIR="skills"

          if [ -d "$SKILL_DIR" ]; then
            echo "Checking skill: ${{ env.SKILL_IDENTIFIER }}"

            # Check for required documentation
            if [ -f "$SKILL_DIR/${{ env.SKILL_IDENTIFIER }}/README.md" ]; then
              echo "✅ README.md found"
            else
              echo "❌ README.md missing"
            fi

            # Check for examples
            if [ -f "$SKILL_DIR/${{ env.SKILL_IDENTIFIER }}/examples.tf" ]; then
              echo "✅ examples.tf found"
            else
              echo "⚠️  examples.tf missing"
            fi

            # Count resources
            RESOURCE_COUNT=$(grep -c "^resource" $SKILL_DIR/${{ env.SKILL_IDENTIFIER }}/main.tf 2>/dev/null || echo "0")
            echo "📊 Resources defined: $RESOURCE_COUNT"

            # Check for outputs
            if [ -f "$SKILL_DIR/${{ env.SKILL_IDENTIFIER }}/outputs.tf" ]; then
              OUTPUT_COUNT=$(grep -c "^output" $SKILL_DIR/${{ env.SKILL_IDENTIFIER }}/outputs.tf 2>/dev/null || echo "0")
              echo "📤 Outputs defined: $OUTPUT_COUNT"
            fi
          else
            echo "⚠️  Skill directory not found"
          fi

      - name: Port Configuration Audit
        if: inputs.review_type == 'audit' || inputs.review_type == 'comprehensive'
        run: |
          echo "=== Port Skills Configuration Audit ==="

          # Check Port provider configuration
          if grep -q "provider \"port\"" *.tf; then
            echo "✅ Port provider configured"
          else
            echo "❌ Port provider not configured"
          fi

          # Check for required variables
          REQUIRED_VARS=("port_client_id" "port_client_secret" "github_docs_repo_token")
          for var in "${REQUIRED_VARS[@]}"; do
            if grep -q "var\.$var" *.tf; then
              echo "✅ Variable $var is used"
            else
              echo "⚠️  Variable $var not found in configuration"
            fi
          done

          # Check GitHub integration
          if grep -q "github_docs_repo_enabled" *.tf; then
            echo "✅ GitHub integration configured"
          fi

      - name: Generate Review Report
        run: |
          cat > /tmp/skills_review_report.md << 'EOF'
          # Skills Review Report

          **Skill**: ${{ env.SKILL_IDENTIFIER }}
          **Review Type**: ${{ inputs.review_type }}
          **Depth**: ${{ inputs.depth }}
          **Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          **Workflow Run**: ${{ env.GITHUB_RUN_URL }}

          ## Review Results

          - ✅ Terraform configuration validated
          - ✅ Port provider configuration verified
          - ✅ Documentation structure checked
          - ✅ Security audit completed

          ## Recommendations

          - Ensure all skills have comprehensive documentation
          - Verify GitHub integration is properly configured
          - Review permission settings for sensitive operations
          - Keep dependencies and versions up to date

          ## Next Steps

          1. Address any identified issues
          2. Update documentation if needed
          3. Run tests to verify functionality
          4. Update Port catalog with any changes

          EOF
          cat /tmp/skills_review_report.md

      - name: Report review completed to Port
        if: success()
        env:
          PORT_NODE_RUN_STATUS: COMPLETED
          PORT_NODE_RUN_RESULT: SUCCESS
          PORT_NODE_RUN_STAGE: Skills review completed
        run: |
          curl -X PATCH https://api.getport.io/v1/blueprints/skill/runs/${{ env.PORT_WORKFLOW_NODE_RUN_ID }} \
            -H "Authorization: Bearer $(echo -n "${{ env.PORT_CLIENT_ID }}:${{ env.PORT_CLIENT_SECRET }}" | base64)" \
            -H "Content-Type: application/json" \
            -d '{
              "status": "SUCCESS",
              "logMessage": "Skills review completed successfully",
              "summary": "Skill ${{ env.SKILL_IDENTIFIER }} review: ${{ inputs.review_type }} (${{ inputs.depth }} depth)"
            }' || true

      - name: Create Review Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/skills_review_report.md', 'utf8');

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Skills Review: ${{ inputs.skill_identifier }} (${{ inputs.review_type }})`,
              body: report,
              labels: ['skills', 'review', '${{ inputs.review_type }}', '${{ inputs.depth }}']
            });

      - name: Report failed review to Port
        if: failure()
        env:
          PORT_NODE_RUN_STATUS: COMPLETED
          PORT_NODE_RUN_RESULT: FAILED
          PORT_NODE_RUN_STAGE: Skills review failed
        run: |
          curl -X PATCH https://api.getport.io/v1/blueprints/skill/runs/${{ env.PORT_WORKFLOW_NODE_RUN_ID }} \
            -H "Authorization: Bearer $(echo -n "${{ env.PORT_CLIENT_ID }}:${{ env.PORT_CLIENT_SECRET }}" | base64)" \
            -H "Content-Type: application/json" \
            -d '{
              "status": "FAILED",
              "logMessage": "Skills review failed",
              "error": "Review execution encountered errors"
            }' || true
