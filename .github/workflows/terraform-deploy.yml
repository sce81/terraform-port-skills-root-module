name: Terraform Port Skills Deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        type: choice
        options: [plan, apply]
      environment:
        description: Target environment
        required: true
        type: choice
        options: [Development, Staging, Production]
      port_workflow_node_run_id:
        description: Port workflow node run identifier
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-skills-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_VAR_port_client_id: ${{ secrets.PORT_CLIENT_ID }}
      TF_VAR_port_client_secret: ${{ secrets.PORT_CLIENT_SECRET }}
      TF_VAR_github_docs_repo_token: ${{ secrets.GH_DOCS_REPO_TOKEN }}
      PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
      PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
      PORT_WORKFLOW_NODE_RUN_ID: ${{ inputs.port_workflow_node_run_id }}
      GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.0"

      - name: Configure Git credentials for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Report plan started to Port
        if: inputs.operation == 'plan'
        run: |
          echo "📊 Terraform Plan - Started"
          echo "Environment: ${{ inputs.environment }}"
          echo "Repository: ${{ github.repository }}"
          echo "Workflow Run: ${{ env.GITHUB_RUN_URL }}"

      - name: Terraform Plan
        id: plan
        if: inputs.operation == 'plan'
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Save Plan Artifact
        if: inputs.operation == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: tfplan
          retention-days: 7

      - name: Report plan completed to Port
        if: inputs.operation == 'plan' && success()
        run: |
          echo "✅ Terraform Plan - Completed Successfully"
          echo "Environment: ${{ inputs.environment }}"

      - name: Report apply started to Port
        if: inputs.operation == 'apply'
        run: |
          echo "🚀 Terraform Apply - Started"
          echo "Environment: ${{ inputs.environment }}"
          echo "Repository: ${{ github.repository }}"
          echo "Workflow Run: ${{ env.GITHUB_RUN_URL }}"

      - name: Terraform Apply
        if: inputs.operation == 'apply'
        run: terraform apply -input=false -auto-approve

      - name: Report apply completed to Port
        if: inputs.operation == 'apply' && success()
        run: |
          echo "✅ Terraform Apply - Completed Successfully"
          echo "Environment: ${{ inputs.environment }}"
          echo "Skills deployed and configured"

      - name: Report failed execution to Port
        if: failure()
        run: |
          echo "❌ Terraform Execution - Failed"
          echo "Environment: ${{ inputs.environment }}"
          echo "Operation: ${{ inputs.operation }}"
          echo "Workflow Run: ${{ env.GITHUB_RUN_URL }}"
          exit 1
